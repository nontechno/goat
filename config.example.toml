# goat configuration file
# Location: $XDG_CONFIG_HOME/goat/config.toml or ~/.config/goat/config.toml
# (if neither exists, float's ~/.config/float/config.toml is read instead).
# Any missing values fall back to the defaults shown below.
# Problems (unknown keys, bad values) are shown in the status bar.

# Shell to spawn in new windows. May include arguments, e.g. "/usr/bin/fish -l".
# Empty: use $SHELL, or /bin/sh if that is unset too.
shell = ""

# Disable mouse support entirely. Also hides the window title bar.
disable_mouse = false

# Window frame:
#   "full"    - box with a three-row title box
#   "compact" - box with the title in the top border
#   "none"    - only a top line with the title; no side or bottom borders.
#               Drag the middle of the line to move; drag either end, or
#               the window's bottom-right 2x2 cells, to resize.
# (The older setting compact = true / false still works when frame isn't set.)
frame = "compact"

# After pressing Esc, a letter key pressed within this many milliseconds is
# treated as Alt+key (for terminals where Alt doesn't work). 0 disables it.
# Esc followed by anything that isn't a shortcut is passed through normally.
alt_timeout_ms = 200

# macOS: Terminal and iTerm2 type a character for Option+key unless "Use
# Option as Meta key" is on (Option+c types ç, Option+q œ). With this on, such
# a character is taken as the Alt shortcut it stands for; characters of keys
# that aren't shortcuts are still typed. Option+n (and e, i, u, `) can't work
# this way: macOS holds them back as accents. Use Esc then n, or turn on
# Option as Meta key.
#   "auto" - on when goat runs on macOS or in Terminal.app / iTerm2
#            (over SSH that usually can't be detected: set "on")
#   "on" / "off"
mac_option_keys = "on"

# Lines of history kept per window. Scroll with the mouse wheel,
# Alt+PageUp / Alt+PageDown (a page), Alt+Shift+PageUp / PageDown (3 lines),
# Alt+Home (oldest line) and Alt+End (live view); typing returns to the live
# view too. While scrolled back, a bar on the right edge shows where you are.
scrollback_lines = 1000

# Long lines: true wraps them at the window's edge, like any terminal. false
# lets them run on past the edge, to be seen by scrolling sideways (Alt+< /
# Alt+>, Shift+mouse wheel; the view also follows the cursor while you type).
# Alt+z (keys.toggle_wrap) switches the active window either way; windows
# with a border show "wrap" / "nowrap +N" at the bottom right.
# Programs are still told the window's real width, so full-screen programs
# (vim, less, htop) are not affected. Shell line editing of commands longer
# than the window may look odd while not wrapping. Switching back to wrap cuts
# lines at the window's width.
wrap_lines = false
# How long a line can get when not wrapping (80-4096 columns).
nowrap_width = 512

# Copying: select text with the mouse (drag, double-click a word,
# triple-click a line; hold Shift in programs that use the mouse) and it is
# copied when you release the button.
# The status bar says which routes were used ("copied 12 characters (via
# terminal + xclip)") and reports a command that failed.
#
# clipboard_osc52: ask the terminal to set the clipboard (OSC 52). Works over
# SSH. Supported by Windows Terminal, iTerm2, kitty, WezTerm, Alacritty, foot,
# Ghostty, recent Konsole; NOT by PuTTY, GNOME Terminal / other VTE terminals
# or macOS Terminal.app; xterm needs "disallowedWindowOps" relaxed.
clipboard_osc52 = true
# Also pipe the text to a clipboard program. "" = pick one automatically:
# inside tmux "tmux load-buffer -w -", on WSL clip.exe, on macOS pbcopy, on
# Wayland wl-copy, on X11 xclip or xsel. "none" = never. Or name one, e.g.
# "xclip -selection clipboard".
copy_command = ""

# Show the active window's current directory in the status bar, left of the
# clock (~ for your home folder; shortened from the left, e.g. "…/src/goat",
# when it doesn't fit). New windows (Alt+c) always start in that directory.
status_show_dir = true

# Show the host name on the left of each window's bottom border (frames
# "full" and "compact"; "none" has no bottom border):  └─ myhost ──── wrap ─┘
# The name is the first line of ~/.hostname (up to 32 characters), so you
# can give a machine a friendlier or shorter label; without that file (or
# if its first line is blank) it is the system's host name. ~/.hostname and
# the system name are re-read every 5 seconds, so a rename shows up by itself.
show_host = true

# Show the user name there too:  └─ alice@myhost ── wrap ─┘
# It is the user of the window's foreground program: after "su" or
# "sudo -i" it shows root (or whoever), and it changes back when you leave.
# While the foreground program is ssh, the frame shows where ssh logs in:
# the host as you typed it and the user ssh uses (from "ssh -G", which reads
# ~/.ssh/config without connecting). Checked twice a second while shown
# (Linux; elsewhere goat's own user and host are shown). What happens inside
# the ssh session (su, a further ssh) can't be seen from here.
show_user = true

# Log of problems, for diagnosing them: crashes (with a stack trace and the
# state of every window), a window's terminal emulator failing (with the
# output it failed on), config problems, clipboard commands failing, windows
# that can't start, ... Each session starts with a line describing it (goat
# version, OS, TERM, terminal program, SSH/tmux, screen size).
#   log_file:  "" = $XDG_STATE_HOME/goat/goat.log (~/.local/state/goat/goat.log);
#              "none" = no log; or a path (~/ allowed). Rotated to .1 at 4 MB.
#   log_level: "error", "warn", "info" (also windows opening/closing and their
#              exit status) or "debug" (also escape sequences goat doesn't handle)
log_file = ""
log_level = "info"

# Window title source:
#   "process"  - name of the program running in the window (like float)
#   "terminal" - the title the program sets (OSC 0/2), else the process name
title_source = "process"

[theme]
# Colors are an ANSI palette index (0-255), "#rrggbb" or "default".
focused_border = 14
# Only the border fades: an inactive window's "number:title" keeps the
# focused color (pinned_border for a pinned window), in bold.
unfocused_border = 8
# Border color for pinned windows (overrides focused/unfocused).
pinned_border = 11
# Status bar (bottom line): text and background, and the color of messages
# shown there (config warnings, "copied N characters", ...).
status_fg = 250
status_bg = 236
hint_text = 11
# The clock at the right end of the status bar, set off from the rest (and
# from the directory next to it, see status_show_dir).
clock_fg = 231
clock_bg = 24
# Background of the window frame, title included (only used when frame is
# "compact" or "none" and the window has no Alt+b colors). Leave unset
# (commented out) for the terminal's default.
# compact_title_bg = 236

# Color schemes that Alt+b (keys.cycle_background) steps the active window
# through, in order, wrapping around. Each is "background:text"; "default"
# means the terminal's own color, and windows start at "default:default".
# The window's border takes the background too. Text a program colors itself
# keeps its own colors. A single color (e.g. 17) sets only the background;
# {bg = 17, fg = 230} also works.
# From colors/terminal_color_pairs_dark.toml: pairs with a contrast ratio
# of at least 7:1 on dark backgrounds.
window_colors = [
  "default:default",
  "17:220",   # Midnight Gold (#00005f / #ffd700, contrast 12.85)
  "24:231",   # Ocean Foam (#005f87 / #ffffff, contrast 7.03)
  "22:230",   # Forest Cream (#005f00 / #ffffd7, contrast 7.79)
  "54:225",   # Plum Pearl (#5f0087 / #ffd7ff, contrast 8.94)
  "235:121",  # Charcoal Mint (#262626 / #87ffaf, contrast 12.22)
  "233:217",  # Ink Coral (#121212 / #ffafaf, contrast 10.71)
  "23:230",   # Deep Teal Ivory (#005f5f / #ffffd7, contrast 7.33)
  "52:224",   # Burgundy Rose (#5f0000 / #ffd7d7, contrast 10.73)
  "19:195",   # Cobalt Ice (#0000af / #d7ffff, contrast 12.13)
  "238:228",  # Slate Lemon (#444444 / #ffff87, contrast 9.23)
  "53:195",   # Mulberry Sky (#5f005f / #d7ffff, contrast 11.89)
  "55:194",   # Grape Lime (#5f00af / #d7ffd7, contrast 9.11)
  "88:230",   # Garnet Ivory (#870000 / #ffffd7, contrast 10.12)
  "90:230",   # Violet Cream (#870087 / #ffffd7, contrast 8.63)
  "234:183",  # Near Black Lavender (#1c1c1c / #d7afff, contrast 9.30)
  "18:225",   # Sapphire Blush (#000087 / #ffd7ff, contrast 12.16)
  "16:214",   # Obsidian Amber (#000000 / #ffaf00, contrast 11.38)
  "20:230",   # Electric Blue Ivory (#0000d7 / #ffffd7, contrast 10.37)
  "21:231",   # Ultramarine Snow (#0000ff / #ffffff, contrast 8.59)
  "56:228",   # Indigo Lemon (#5f00d7 / #ffff87, contrast 8.07)
  "57:231",   # Electric Violet White (#5f00ff / #ffffff, contrast 7.17)
  "89:230",   # Raspberry Vanilla (#87005f / #ffffd7, contrast 9.35)
  "91:195",   # Orchid Ice (#8700af / #d7ffff, contrast 7.41)
  "124:231",  # Crimson White (#af0000 / #ffffff, contrast 7.44)
  "125:231",  # Berry White (#af005f / #ffffff, contrast 7.03)
  "232:123",  # Obsidian Aqua (#080808 / #87ffff, contrast 16.95)
  "236:222",  # Graphite Apricot (#303030 / #ffd787, contrast 9.63)
  "237:194",  # Stone Mint (#3a3a3a / #d7ffd7, contrast 10.39)
  "239:229",  # Smoke Butter (#4e4e4e / #ffffaf, contrast 7.99)
  "240:231",  # Ash White (#585858 / #ffffff, contrast 7.11)
  "17:159",   # Midnight Aqua (#00005f / #afffff, contrast 15.94)
  "52:222",   # Burgundy Apricot (#5f0000 / #ffd787, contrast 10.31)
]

# When true, a new window (Alt+c) starts with the scheme after the focused
# window's in window_colors (wrapping around) instead of "default:default",
# so it stands out from the window it was opened from.
new_window_next_colors = true

[keys]
# Every binding is a single character used with the Alt modifier.
# Arrow keys always work too: Alt+arrow moves, Alt+Shift+arrow resizes.
# Alt+1..9 focus windows by the number shown in their title; Alt+0 focuses
# the full-screen background shell.
new_window = "c"
focus_next = "n"
focus_prev = "p"
quit = "q"
close_window = "x"
move_left = "h"
move_down = "j"
move_up = "k"
move_right = "l"
resize_left = "H"           # Alt+Shift+H: narrower
resize_down = "J"           # Alt+Shift+J: taller
resize_up = "K"             # Alt+Shift+K: shorter
resize_right = "L"          # Alt+Shift+L: wider
pin_window = "w"            # keep this window above all others
cycle_background = "b"      # next scheme from theme.window_colors
toggle_wrap = "z"           # wrap long lines, or not (see wrap_lines)
scroll_left = "<"           # not wrapping: view left (Alt+Shift+,)
scroll_right = ">"          # ... and right (Alt+Shift+.)
show_events = "-"           # events window: bells, notifications, exits, ...

[layout]
# Offset, in character cells, when cascading a new window from the focused one.
cascade_offset_x = 2
cascade_offset_y = 1

# Size of a new window relative to the area above the status bar (0.0-1.0].
new_window_width_ratio = 0.5
new_window_height_ratio = 0.5

# Minimum window dimensions, including borders. The height is raised
# automatically if the frame needs more (5 for "full", 3 for "compact",
# 2 for "none").
min_window_cols = 6
min_window_rows = 5
